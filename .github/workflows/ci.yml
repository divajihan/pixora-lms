name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pixora
          MYSQL_USER: pixora
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, pdo_mysql, pdo_sqlite, redis
          tools: composer:v2
          coverage: none

      # Node 22 (not 20): vite-plus and @rolldown/plugin-babel from the starter kit require Node >= 22.12.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint PHP (Pint)
        run: vendor/bin/pint --test

      - name: Lint frontend (oxlint + oxfmt via vp check)
        run: npm run lint

      - name: Type-check frontend
        run: npm run types:check

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress

      # Verifies migrations on real MySQL 8 (Pest itself uses in-memory SQLite, see phpunit.xml).
      # DB vars are scoped to this step: job-level env would override phpunit.xml's <env> values.
      - name: Run migrations against MySQL
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: pixora
          DB_USERNAME: pixora
          DB_PASSWORD: secret

      # Verifies the production build (tests do not need it: TestCase calls withoutVite()).
      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: php artisan test
